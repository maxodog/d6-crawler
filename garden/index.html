<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Crawler — Prueba 1: kits de dados</title>
<style>
:root{
  --bg:#efe9d2; --card:#fbf8ec; --ink:#2b2a1f; --mut:#6d6a55; --line:#d8d1b3;
  --leaf:#3f7d3b; --leaf-d:#2c5a2a; --soil:#7a5a3a; --acc:#d9822b; --bad:#b5473a; --good:#3f7d3b; --sel:#2a6fb0;
  --t1:#d3e4b4; --t2:#c5d9a2; --wall:#2f6b3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:10px 12px 40px}
h1,h2,h3{margin:0;font-family:Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{font-family:Georgia,serif;font-weight:700;font-size:19px;color:var(--leaf-d)}
.tag{font-size:11px;background:var(--leaf);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle;font-family:system-ui}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.btn{background:var(--leaf);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;min-height:44px}
.btn:disabled{background:#b9b7a6;color:#f4f2e6;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--leaf-d);border:1.5px solid var(--leaf)}
.btn.warn{background:var(--acc)}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pick{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.pick.on{border-color:var(--leaf);background:#f1f8e6;box-shadow:0 0 0 2px #cfe4b0}
.pick .em{font-size:30px;line-height:1}
.pick b{display:block}
.chips{display:flex;gap:5px;margin:4px 0;flex-wrap:wrap}
.chip{background:#ece6c9;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600}
.small{font-size:12.5px;color:var(--mut)}
.lead{color:var(--mut);margin:4px 0 8px}
/* estado */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 8px}
.hud .lv{font-weight:700}
.hearts{font-size:18px;letter-spacing:1px;white-space:nowrap}
/* tablero */
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:var(--soil);padding:5px;border-radius:14px;width:100%;aspect-ratio:1/1;touch-action:manipulation}
.cell{position:relative;border-radius:7px;background:var(--t1);display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;border:0;padding:0;overflow:hidden}
.cell.alt{background:var(--t2)}
.cell.wall{background:var(--wall);background-image:radial-gradient(circle at 25% 30%,#4c8a4a 0 22%,transparent 24%),radial-gradient(circle at 70% 65%,#3e7c3d 0 26%,transparent 28%),radial-gradient(circle at 55% 20%,#58985a 0 16%,transparent 18%)}
.cell.reach{background:#b9dba0;box-shadow:inset 0 0 0 2px #6aa84f;cursor:pointer}
.cell.reach .cost{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700;color:#2c5a2a}
.cell .em{font-size:clamp(20px,8.4vw,40px);line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.cell.hero{box-shadow:inset 0 0 0 3px var(--sel)}
.cell.hero .em{font-size:clamp(22px,9vw,42px)}
.cell.mon{box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.cell.atk{box-shadow:inset 0 0 0 3px var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px var(--bad),0 0 8px 1px rgba(181,71,58,.6)}}
.pips{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:2px}
.pip{width:6px;height:6px;border-radius:50%;background:#d93b2f;border:1px solid #fff}
.pip.lost{background:#bbb}
.badge{position:absolute;top:1px;left:2px;font-size:11px;font-weight:800;background:#fff;border-radius:6px;padding:0 4px;color:var(--bad)}
.badge.ok{color:var(--good)}
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;animation:rise .9s forwards}
@keyframes rise{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* paneles */
.dice{display:flex;gap:10px;justify-content:center;margin:8px 0}
.die{width:72px;height:72px;border-radius:14px;background:#fff;border:2.5px solid #8a8668;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.die b{font-size:30px;line-height:1}
.die small{font-size:11px;color:var(--mut);font-weight:700}
.die.sel{border-color:var(--sel);box-shadow:0 0 0 3px #bcd8f2}
.die.used{opacity:.45}
.die.rr{border-color:var(--acc);box-shadow:0 0 0 3px #f6d6b0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#fff;border:2px dashed #a9a58a;border-radius:12px;padding:8px 4px;text-align:center;min-height:74px}
.slot.on{border-style:solid;border-color:var(--leaf);background:#f1f8e6}
.slot.tgt{border-color:var(--sel);background:#eaf3fb}
.slot .k{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.slot .v{font-size:19px;font-weight:800;margin-top:2px}
.slot .f{font-size:11.5px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat .k{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}
.stat .v{font-size:20px;font-weight:800}
.stat .f{font-size:11px;color:var(--mut)}
.bar{height:5px;border-radius:3px;background:#e6e0c3;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
.msg{min-height:38px;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:14px;margin:8px 0}
.mons{display:flex;flex-direction:column;gap:6px}
.mon-row{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.mon-row.atk{border-color:var(--bad);background:#fdf1ef}
.mon-row .em{font-size:24px}
.mon-row .nm{font-weight:700;font-size:13.5px}
.mon-row .st{font-size:12px;color:var(--mut)}
.mon-row .hpn{margin-left:auto;font-weight:800;color:var(--bad)}
.veil{position:fixed;inset:0;background:rgba(30,28,15,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--card);border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h2{margin-bottom:6px}
.up{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.up .btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px}
.up .btn small{font-weight:500;opacity:.9;font-size:12px}
details{margin:8px 0}
summary{cursor:pointer;font-weight:700;color:var(--leaf-d)}
ul.rules{padding-left:18px;margin:6px 0}
ul.rules li{margin:4px 0}
.hint{color:var(--sel);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
const E = (function(){
'use strict';
/* Garden Crawler — motor (sin DOM). Reglas basadas en D6 Crawler, tablero 6x6 y kits de dados por héroe. */
const COLS = 6, ROWS = 6, N = COLS * ROWS;
const idx = (x, y) => y * COLS + x;
const XY = i => [i % COLS, (i / COLS) | 0];
// [dx, dy, coste de Movimiento]: recto 2, diagonal 3
const DIRS = [[1,0,2],[-1,0,2],[0,1,2],[0,-1,2],[1,1,3],[1,-1,3],[-1,1,3],[-1,-1,3]];
const START_HP = 6, SKILL_MAX = 6;

let rnd = Math.random;
function setRng(f) { rnd = f || Math.random; }
const roll = s => 1 + Math.floor(rnd() * s);

/* ---------- Datos ---------- */
const HEROES = {
  beetle: { key: 'beetle', name: 'Escarabajo rinoceronte', emoji: '🪲', kit: [8, 6, 4],
    abil: 'Cornada', txt: 'Una vez por nivel, empuja a un monstruo pegado a ti (en recto) hasta 3 casillas. Si choca con un muro, el borde u otro monstruo, recibe 1 de daño (y el otro monstruo también).' },
  mantis: { key: 'mantis', name: 'Mantis religiosa', emoji: '🦗', kit: [12, 4, 4],
    abil: 'Emboscada', txt: 'Pasiva: si todavía no te has movido en el turno, tu primer ataque hace 2 de daño.' }
};
const EQUIPS = {
  thorn: { key: 'thorn', name: 'Espina de rosa', emoji: '🌹', type: 'Arma', txt: 'Tus ataques cuestan 1 punto de Ataque menos (mínimo 1).' },
  shield: { key: 'shield', name: 'Escudo de pétalo', emoji: '🌸', type: 'Armadura', txt: 'Tu Defensa es 1 punto más alta en cada turno.' },
  helm: { key: 'helm', name: 'Casco de bellota', emoji: '🌰', type: 'Armadura', txt: 'Una vez por turno, repites un dado y te quedas con el mejor de los dos resultados.' }
};
const MONS = {
  tij: { key: 'tij', name: 'Tijereta', plural: 'Tijeretas', emoji: '🦂', color: '#b5473a', hp: 2, spd: 6, atk: 4, def: 3, rng: 3, txt: 'Rápida y frágil.' },
  bom: { key: 'bom', name: 'Escarabajo bombardero', plural: 'Escarabajos bombarderos', emoji: '🐞', color: '#c0792b', hp: 3, spd: 4, atk: 5, def: 5, rng: 5, txt: 'Dispara a distancia.' },
  coc: { key: 'coc', name: 'Cochinilla', plural: 'Cochinillas', emoji: '🐌', color: '#6c7a89', hp: 4, spd: 3, atk: 6, def: 6, rng: 3, txt: 'Lenta y acorazada.' },
  avi: { key: 'avi', name: 'Avispón', plural: 'Avispones', emoji: '🐝', color: '#c9a227', hp: 4, spd: 5, atk: 8, def: 5, rng: 4, txt: 'Golpea muy fuerte.' }
};
const MAPS = {
  A: ['......', '.#..#.', '......', '..##..', '.#....', 'H...#.'],
  B: ['..#...', '...#..', '.##...', '...#.#', '.#....', '....#H']
};
const rot180 = m => m.slice().reverse().map(r => r.split('').reverse().join(''));
MAPS.A2 = rot180(MAPS.A); MAPS.B2 = rot180(MAPS.B);

// 12 niveles: cada combinación mapa+giro enfrenta siempre al mismo monstruo; cambian la cantidad y las posiciones
const LEVEL_DEFS = [
  { t: 'Los tulipanes',   map: 'A',  m: 'tij', at: [[3,2],[2,0],[4,2],[2,2]] },
  { t: 'El seto de boj',  map: 'B',  m: 'coc', at: [[5,0]] },
  { t: 'Macetas volcadas', map: 'A2', m: 'bom', at: [[0,1],[0,4],[0,3]] },
  { t: 'El compost',      map: 'B2', m: 'avi', at: [[5,2],[5,4]] },
  { t: 'El rosal',        map: 'A',  m: 'tij', at: [[0,1],[1,0],[3,1],[1,3],[2,2],[5,0],[4,2]] },
  { t: 'La enredadera',   map: 'B',  m: 'coc', at: [[2,5],[4,0],[1,0]] },
  { t: 'El invernadero',  map: 'A2', m: 'bom', at: [[3,3],[0,3],[4,5],[5,4],[0,5]] },
  { t: 'El cobertizo',    map: 'B2', m: 'avi', at: [[5,1],[4,4],[5,2],[5,5],[1,5],[5,4]] },
  { t: 'La glorieta',     map: 'A',  m: 'tij', at: [[5,0],[4,4],[5,5],[3,1],[2,2],[2,4],[1,3],[4,0],[4,3]] },
  { t: 'El estanque seco', map: 'B', m: 'coc', at: [[3,0],[2,1],[4,1],[0,4]] },
  { t: 'El muro de piedra', map: 'A2', m: 'bom', at: [[3,1],[5,4],[1,1],[3,3],[2,1],[0,4],[4,3]] },
  { t: 'El panal',        map: 'B2', m: 'avi', at: [[0,5],[5,3],[5,2],[5,4],[1,5],[1,4],[3,1],[5,1]] }
];

let LEVELS = [];
function buildLevel(def, num) {
  const rows = MAPS[def.map], walls = new Array(N).fill(false);
  let start = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = rows[y][x];
    if (c === '#') walls[idx(x, y)] = true;
    if (c === 'H') start = idx(x, y);
  }
  return { num, title: def.t, mapKey: def.map, mon: MONS[def.m], walls, start, spawns: def.at.map(([x, y]) => idx(x, y)), rd: {}, lm: {} };
}
function loadLevels(defs) { LEVELS = (defs || LEVEL_DEFS).map((d, i) => buildLevel(d, i + 1)); return LEVELS; }
loadLevels();

/* ---------- Caminos ---------- */
function adjOf(lv) {
  if (lv._adj) return lv._adj;
  const adj = new Array(N);
  for (let i = 0; i < N; i++) {
    const [x, y] = XY(i), out = [];
    for (const [dx, dy, c] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const j = idx(nx, ny);
      if (lv.walls[j]) continue;
      out.push(c === 3 ? [j, c, idx(x + dx, y), idx(x, y + dy)] : [j, c, -1, -1]);
    }
    adj[i] = out;
  }
  lv._adj = adj;
  return adj;
}
function dijkstra(lv, src, blocked, cut) {
  const dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  const adj = adjOf(lv);
  dist[src] = 0;
  for (;;) {
    let u = -1, b = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < b) { b = dist[i]; u = i; }
    if (u < 0) break;
    done[u] = true;
    const ns = adj[u];
    for (let k = 0; k < ns.length; k++) {
      const v = ns[k][0], c = ns[k][1];
      if (blocked && blocked[v]) continue;
      if (c === 3) { const h = ns[k][2], w = ns[k][3]; if ((lv.walls[h] || (cut && cut[h])) && (lv.walls[w] || (cut && cut[w]))) continue; }
      if (b + c < dist[v]) { dist[v] = b + c; prev[v] = u; }
    }
  }
  return { dist, prev };
}
function rangeDist(lv, a, b) {
  let d = lv.rd[a];
  if (!d) d = lv.rd[a] = dijkstra(lv, a, null).dist;
  return d[b];
}
function distAdv(lv, src, advI) {
  if (!lv._dc) lv._dc = new Map();
  let tab = lv._dc.get(advI);
  if (!tab) { tab = new Array(N); lv._dc.set(advI, tab); }
  let r = tab[src];
  if (!r) { const bl = new Array(N).fill(false); bl[advI] = true; r = tab[src] = dijkstra(lv, src, bl, bl); }
  return r;
}

/* ---------- Línea de visión ---------- */
const LOS_PTS = [0.02, 0.2, 0.5, 0.8, 0.98];
function segTouches(ax, ay, bx, by, sx, sy) {
  const dx = bx - ax, dy = by - ay;
  let lo = 0, hi = 1;
  if (dx === 0) { if (ax < sx || ax > sx + 1) return false; }
  else {
    let t1 = (sx - ax) / dx, t2 = (sx + 1 - ax) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    lo = Math.max(lo, t1); hi = Math.min(hi, t2);
  }
  if (dy === 0) { if (ay < sy || ay > sy + 1) return false; }
  else {
    let t1 = (sy - ay) / dy, t2 = (sy + 1 - ay) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    lo = Math.max(lo, t1); hi = Math.min(hi, t2);
  }
  return hi - lo >= -1e-9;
}
function losSegs(lv, a, b) {
  const key = a * N + b;
  if (lv.lm[key] !== undefined) return lv.lm[key];
  const [ax, ay] = XY(a), [bx, by] = XY(b), walls = [], out = [];
  for (let w = 0; w < N; w++) if (lv.walls[w] && w !== a && w !== b) walls.push(XY(w));
  for (const u of LOS_PTS) for (const v of LOS_PTS) for (const x of LOS_PTS) for (const y of LOS_PTS) {
    const p = ax + u, q = ay + v, r = bx + x, s = by + y;
    let ok = true;
    for (const [wx, wy] of walls) if (segTouches(p, q, r, s, wx, wy)) { ok = false; break; }
    if (ok) out.push(p, q, r, s);
  }
  lv.lm[key] = out;
  return out;
}
function hasLOS(lv, a, b, blockers) {
  if (a === b) return true;
  const segs = losSegs(lv, a, b);
  if (!segs.length) return false;
  const bl = blockers.filter(t => t !== a && t !== b).map(XY);
  if (!bl.length) return true;
  for (let k = 0; k < segs.length; k += 4) {
    let ok = true;
    for (const [tx, ty] of bl) if (segTouches(segs[k], segs[k + 1], segs[k + 2], segs[k + 3], tx, ty)) { ok = false; break; }
    if (ok) return true;
  }
  return false;
}

/* ---------- Estado ---------- */
const lvOf = st => LEVELS[st.levelIdx];
function freshTurn(st) {
  return { dice: null, sides: HEROES[st.hero].kit.slice(), assign: { spd: -1, atk: -1, def: -1 }, rerolled: false, moved: false, attacks: 0,
           spd: 0, atk: 0, def: 0, rng: 0, spdLeft: 0, atkLeft: 0 };
}
function rollTurn(st) { st.turn.dice = st.turn.sides.map(roll); }
function setupLevel(st, i) {
  const lv = LEVELS[i];
  st.levelIdx = i;
  const [x, y] = XY(lv.start);
  st.adv.x = x; st.adv.y = y;
  st.mons = lv.spawns.map((s, n) => {
    const [mx, my] = XY(s), m = lv.mon;
    return { id: n + 1, x: mx, y: my, hp: m.hp, maxHp: m.hp, spd: m.spd, atk: m.atk, def: m.def, rng: m.rng };
  });
  st.abil = false;
  st.phase = 'energy';
  st.turn = freshTurn(st);
  rollTurn(st);
  st.undo = [];
  st.turnNo = 1;
  st.cp = { hp: st.adv.hp, adv: Object.assign({}, st.adv) };
  return st;
}
function newRun(hero, equip) {
  const st = { hero, equip, levelIdx: 0, adv: { x: 0, y: 0, hp: START_HP, spd: 1, atk: 1, def: 1, rng: 2 }, mons: [], phase: 'energy', turn: null, undo: [], turnNo: 1, abil: false, cp: null };
  return setupLevel(st, 0);
}
function retryLevel(st) {
  const cp = st.cp;
  st.adv = Object.assign({}, cp.adv);
  return setupLevel(st, st.levelIdx);
}

/* ---------- Fase de energía ---------- */
function assignDie(st, skill, die) {
  const t = st.turn;
  for (const k of ['spd', 'atk', 'def']) if (t.assign[k] === die) t.assign[k] = -1;
  t.assign[skill] = die;
}
function unassign(st, skill) { st.turn.assign[skill] = -1; }
const assignComplete = t => t.assign.spd >= 0 && t.assign.atk >= 0 && t.assign.def >= 0;
function canReroll(st) { return st.equip === 'helm' && st.phase === 'energy' && !st.turn.rerolled; }
function useHelm(st, die) {
  if (!canReroll(st) || die < 0 || die > 2) return false;
  const nw = roll(st.turn.sides[die]);
  st.turn.lastRoll = nw;
  st.turn.dice[die] = Math.max(st.turn.dice[die], nw);
  st.turn.rerolled = true;
  return true;
}
function confirmEnergy(st) {
  const t = st.turn, a = st.adv;
  t.spd = a.spd + t.dice[t.assign.spd]; t.atk = a.atk + t.dice[t.assign.atk]; t.def = a.def + t.dice[t.assign.def] + (st.equip === 'shield' ? 1 : 0); t.rng = a.rng;
  t.spdLeft = t.spd; t.atkLeft = t.atk;
  st.phase = 'move';
  st.undo = [];
}

/* ---------- Fase del héroe ---------- */
function pushUndo(st) {
  st.undo.push(JSON.stringify({ x: st.adv.x, y: st.adv.y, hp: st.adv.hp, mons: st.mons, spdLeft: st.turn.spdLeft, atkLeft: st.turn.atkLeft,
    moved: st.turn.moved, attacks: st.turn.attacks, abil: st.abil }));
}
function popUndo(st) {
  const s = JSON.parse(st.undo.pop());
  st.adv.x = s.x; st.adv.y = s.y; st.adv.hp = s.hp; st.mons = s.mons;
  st.turn.spdLeft = s.spdLeft; st.turn.atkLeft = s.atkLeft; st.turn.moved = s.moved; st.turn.attacks = s.attacks; st.abil = s.abil;
}
function reachFromAdv(st) {

    if (e.t === 'move') {
      const d = ui.disp.find(o => o.id === e.id);
      for (const c of e.path.slice(1)) { const [x, y] = XY(c); d.x = x; d.y = y; render(); await sleep(150); }
    } else if (e.t === 'attack') {
      const hi = idx(S.adv.x, S.adv.y);
      if (!e.ids.length) say('Ningún monstruo te alcanza.');
      else if (e.dmg > 0) { say(`Te atacan ${e.ids.length}: Ataque total ${e.total} ÷ tu Defensa ${e.def} = <b>${e.dmg} de daño</b>.`); fx(hi, '−' + e.dmg); }
      else say(`Te atacan ${e.ids.length}: Ataque total ${e.total} ÷ tu Defensa ${e.def} = 0 de daño.`);
      render(); await sleep(500);
    }
  }
  ui.disp = null; ui.anim = false;
  if (S.phase === 'dead') { ui.modal = { t: 'dead' }; }
  else { ui.selDie = -1; ui.rr = false; say('Nuevo turno: reparte tus dados.'); }
  render();
}
function onClick(ev) {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (ui.anim) return;
  if (act === 'hero') { ui.hero = k; render(); return; }
  if (act === 'equip') { ui.equip = k; render(); return; }
  if (act === 'begin') { S = E.newRun(ui.hero, ui.equip); ui.screen = 'game'; ui.selDie = -1; ui.rr = false; ui.modal = null; ui.cornada = false; say(`Nivel 1. Tira de tus dados y repártelos.`); render(); return; }
  if (act === 'menu') { ui.modal = { t: 'menu' }; render(); return; }
  if (act === 'close') { ui.modal = null; render(); return; }
  if (act === 'restart') { ui.screen = 'start'; ui.modal = null; S = null; render(); return; }
  if (!S) return;
  if (act === 'retry') { E.retryLevel(S); ui.modal = null; ui.selDie = -1; ui.rr = false; ui.cornada = false; say('Nivel reiniciado. Reparte tus dados.'); render(); return; }
  if (act === 'up') {
    if (!E.applyBreak(S, k)) return;
    const done = !E.nextLevel(S);
    ui.modal = done ? { t: 'won' } : null; ui.selDie = -1; ui.rr = false; ui.cornada = false;
    say(`Nivel ${S.levelIdx + 1}: ${E.lvOf(S).title}. Reparte tus dados.`); render(); return;
  }
  if (ui.modal) return;
  if (S.phase === 'energy') {
    const t = S.turn;
    if (act === 'die') {
      const i = +el.dataset.i;
      if (ui.rr) { const old = t.dice[i]; E.useHelm(S, i); ui.rr = false; const nw = t.lastRoll; say(`Repetiste el D${t.sides[i]}: tenías ${old}, salió ${nw}. ` + (nw > old ? `Te quedas con <b>${nw}</b>.` : `Te quedas con <b>${old}</b> (el mejor de los dos).`)); render(); return; }
      ui.selDie = ui.selDie === i ? -1 : i; render(); return;
    }
    if (act === 'slot') {
      if (ui.selDie >= 0) { E.assignDie(S, k, ui.selDie); ui.selDie = -1; }
      else if (t.assign[k] >= 0) E.unassign(S, k);
      render(); return;
    }
    if (act === 'helm') { if (E.canReroll(S)) { ui.rr = !ui.rr; ui.selDie = -1; render(); } return; }
    if (act === 'confirm') {
      if (!E.assignComplete(t)) return;
      E.confirmEnergy(S); ui.selDie = -1; ui.rr = false;
      say(S.hero === 'mantis' ? 'Tu fase. Si atacas antes de moverte, tu primer golpe hace 2 de daño.' : 'Tu fase: muévete (casillas verdes) y ataca (monstruos con borde rojo).');
      render(); return;
    }
    return;
  }
  if (S.phase !== 'move') return;
  if (act === 'go') {
    const i = +el.dataset.i, R = E.reachFromAdv(S);
    if (!(R.dist[i] > 0 && R.dist[i] <= S.turn.spdLeft)) return;
    E.moveAdv(S, i, R.dist[i]); ui.cornada = false; say(`Te mueves (−${R.dist[i]} de Movimiento).`); afterAction(); return;
  }
  if (act === 'mon') {
    const m = S.mons.find(o => o.id === +el.dataset.id); if (!m) return;
    if (ui.cornada) {
      const r = E.cornada(S, m);
      ui.cornada = false;
      if (!r) { say('La Cornada solo empuja a un monstruo pegado a ti, en recto (no en diagonal).'); render(); return; }
      const [tx, ty] = r.to;
      say(r.hit ? `¡Cornada! Choca ${r.hit === 'wall' ? 'con un muro o el borde' : 'con otro monstruo'}: recibe 1 de daño${r.other ? ' (y el otro también)' : ''}.` : `¡Cornada! Lo empujas ${r.steps} casillas.`);
      if (r.hit) fx(idx(tx, ty), '−1');
      afterAction(); return;
    }
    const inf = E.attackInfo(S, m);
    if (!inf.ok) {
      say(inf.why === 'range' ? `Fuera de alcance: está a distancia ${inf.rd} y tu Alcance es ${S.turn.rng}.` : inf.why === 'los' ? 'No tienes línea de tiro: un muro u otro monstruo estorba.' : `Te faltan puntos de Ataque: cuesta ${inf.cost} y te quedan ${S.turn.atkLeft}.`);
      render(); return;
    }
    const r = E.attackMon(S, m);
    say(`Golpeas a ${E.lvOf(S).mon.name} ${m.id} (−${inf.cost} de Ataque, ${r.dmg} de daño)${r.dead ? ' y lo derrotas.' : '.'}`);
    fx(idx(m.x, m.y), '−' + r.dmg); afterAction(); return;
  }
  if (act === 'cornada') {
    if (S.abil) return;
    ui.cornada = !ui.cornada;
    say(ui.cornada ? 'Toca un monstruo pegado a ti (arriba, abajo o a los lados) para empujarlo.' : 'Cornada cancelada.'); render(); return;
  }
  if (act === 'undo') { if (S.undo.length) { E.popUndo(S); ui.cornada = false; say('Acción deshecha.'); render(); } return; }
  if (act === 'end') { endTurn(); return; }
}
app.addEventListener('click', onClick);
window.__gc = { E, get S() { return S; }, ui };
render();
})();
</script>
