<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Crawler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07130b; --card:#0f2415; --tile:#1b3926; --tile2:#1f432d; --line:#8fcf7a; --line-dim:rgba(143,207,122,.28);
  --chalk:#eaf6e0; --muted:#97b58c; --torch:#ffb13b; --foe:#ff6a5c; --good:#8fcf7a; --sel:#6cc4ff; --soil:#33261a; --wall:#2c6a3a;
  --display:'Pirata One','Times New Roman',serif; --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--chalk)}
body{font-family:var(--body);font-size:18px;line-height:1.25;touch-action:manipulation;
  background-image:linear-gradient(rgba(143,207,122,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(143,207,122,.06) 1px,transparent 1px);background-size:26px 26px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
#app{width:100%;max-width:440px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-weight:400}
h2{font-family:var(--display);font-size:34px;line-height:1.05}
h3{font-family:var(--display);font-size:24px;line-height:1.1}
.lead{color:var(--muted);margin:0}
.small{font-size:15px;color:var(--muted)}
/* cabecera */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;line-height:.9}
.brand .mark{font-family:var(--display);font-size:32px}
.brand .sub{font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--torch);font-weight:600;margin-top:3px}
.top-actions{display:flex;gap:8px}
.ghost{background:transparent;border:1.5px solid var(--line-dim);border-radius:6px;padding:7px 12px;min-height:38px;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.ghost:hover{border-color:var(--line);color:var(--chalk)}
.ghost.back{align-self:flex-start}
.btn{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;min-height:46px;font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.btn small{font-size:13px;font-weight:500;letter-spacing:.04em;opacity:.85;text-transform:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--torch);border-color:var(--torch);color:#1c1405}
.btn.warn{border-color:var(--torch);color:var(--torch)}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* tarjeta */
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;
  box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--line-dim),0 18px 40px rgba(0,0,0,.45)}
.card.plain{border-color:var(--line-dim);box-shadow:none}
/* pantalla de inicio */
.menu-s{display:flex;flex-direction:column;gap:14px}
.banner{width:100%;display:block;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));border:0}
.logo{border-left:5px solid var(--torch);padding-left:12px;display:flex;flex-direction:column;line-height:.95}
.logo b{font-family:var(--display);font-weight:400;font-size:50px;letter-spacing:.01em}
.logo span{font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--torch);font-weight:700;margin-top:4px}
.tag-line{font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:#b6e3a2;font-weight:500;margin:0}
.btn.main{background:var(--torch);border-color:var(--torch);color:#1c1405;align-items:flex-start;padding:14px 16px;font-size:22px;border-radius:0;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.menu-btns{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.menu-btns .main{width:100%}
.world-switch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;text-decoration:none;color:var(--chalk);
  background:linear-gradient(135deg,rgba(255,177,59,.14),rgba(255,177,59,.04));border:1.5px solid var(--torch);border-radius:10px;padding:8px 12px;min-height:60px}
.world-switch .ws-ic{width:42px;height:56px;border-radius:5px;display:grid;place-items:center;font-size:24px;background:#0b2a1c;border:1px solid var(--line-dim)}
.world-switch small{display:block;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--torch);font-weight:600}
.world-switch b{font-family:var(--display);font-weight:400;font-size:24px}
.world-switch .ws-arrow{margin-left:auto;font-size:26px;color:var(--torch)}
.fine{font-size:14px;color:var(--muted);margin:2px 0 0}
/* aventuras y héroes */
.adv-card,.hero-card{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line-dim);border-radius:12px;padding:10px;color:var(--chalk)}
.adv-card{border-color:var(--torch);padding:0;overflow:hidden}
.adv-card .cover{display:block;width:100%}
.adv-card .info{display:block;padding:10px 12px 12px}
.adv-card .kind{font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--torch);font-weight:700}
.adv-card h3{font-size:30px;margin:2px 0 2px}
.hero-card{display:flex;gap:12px;align-items:flex-start;border-color:var(--line-dim)}
.hero-card:hover,.hero-card.on{border-color:var(--torch)}
.hero-card.on{background:rgba(255,177,59,.08)}
.hero-card .ic{flex:0 0 58px;height:58px;border-radius:8px;display:grid;place-items:center;font-size:32px;background:rgba(143,207,122,.07);border:1px solid var(--line-dim)}
.hero-card h3{font-size:27px}
.hero-card p{margin:2px 0 0;color:var(--muted);font-size:17px}
.chips{display:flex;gap:6px;margin:3px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--torch);color:var(--torch);border-radius:5px;padding:0 7px;font-size:15px;font-weight:700;letter-spacing:.05em}
.sect{font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--torch);border-bottom:1px solid var(--line-dim);padding-bottom:3px;margin:2px 0}
/* partida (misma estructura que Archeodice y Colossus) */
.top.game{align-items:center}
.top.game .brand .mark{font-size:25px;white-space:nowrap}
.hp{display:flex;align-items:center;gap:7px;margin-left:auto}
.pipsd{display:flex;gap:5px}
.pipsd i{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--torch)}
.pipsd i.on{background:var(--torch)}
.hpnum{font-size:15px;color:var(--muted);font-weight:600;white-space:nowrap}
.ghost.icon{min-width:36px;min-height:36px;padding:0;font-size:18px;letter-spacing:0}
.card-head{display:flex;flex-direction:column;gap:3px;padding:2px 6px 0}
.card-head .kind{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--torch);font-weight:700}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvl-name{margin:0;font-family:var(--display);font-weight:400;font-size:27px;line-height:1}
.lvl-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lvl-num{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.lvl-num b{color:var(--torch);font-size:16px;letter-spacing:.1em}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border:1px solid var(--line);transform:rotate(45deg)}
.dots i.done{background:var(--line)}
.dots i.now{background:var(--torch);border-color:var(--torch)}
.board{position:relative;width:100%;aspect-ratio:1/1;border:1.5px solid var(--line);background:rgba(143,207,122,.04)}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}
.tile{position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:inset 0 0 0 .5px var(--line-dim);color:var(--chalk);overflow:hidden;display:block}
.tile.wall{background-color:#1d4d2b;background-image:repeating-linear-gradient(135deg,rgba(143,207,122,.55) 0 1.5px,transparent 1.5px 7px);box-shadow:inset 0 0 0 1.5px var(--line)}
.tile.reach{background:rgba(255,177,59,.10);box-shadow:inset 0 0 0 1px rgba(255,177,59,.7);cursor:pointer}
.tile.reach::before{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:var(--torch);transform:rotate(45deg);opacity:.8}
.tile.reach::after{content:attr(data-cost);position:absolute;right:3px;bottom:1px;font-size:13px;font-weight:700;color:var(--torch)}
.tile.target{box-shadow:inset 0 0 0 2px var(--foe);background:rgba(255,106,92,.14);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px rgba(255,106,92,.35)}}
.tok{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(24px,8.2vw,38px);line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.tile.hero .spot{position:absolute;left:10%;top:10%;width:80%;height:80%;border-radius:50%;display:grid;place-items:center;background:rgba(8,20,10,.6);box-shadow:0 0 8px 1px rgba(255,177,59,.55),inset 0 0 0 1.5px rgba(255,177,59,.45);font-size:clamp(20px,6.6vw,31px);line-height:1}
.tile .badge{position:absolute;right:2px;bottom:2px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:var(--card);border:1.5px solid var(--foe);font-size:13px;font-weight:700;line-height:14px;text-align:center;color:var(--chalk)}
.tile .cost{position:absolute;left:2px;top:1px;font-size:13px;font-weight:700;color:var(--foe);line-height:1}
.tile .amb{position:absolute;left:2px;top:1px;font-size:13px;font-weight:700;color:var(--torch);line-height:1.1}
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;color:var(--chalk);text-shadow:0 1px 0 var(--card),0 0 6px var(--card);pointer-events:none;animation:rise .9s forwards;z-index:3}
@keyframes rise{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.foot{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:10px;border-top:1.5px solid var(--line-dim);padding:10px 4px 2px}
.foot .ico{width:54px;height:54px;border:1.5px solid var(--line-dim);border-radius:8px;display:grid;place-items:center;font-size:30px}
.foot .nm{font-family:var(--display);font-size:22px;line-height:1}
.foot .nm small{font-family:var(--body);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-left:6px}
.st5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.st5 div{text-align:center;border:1px solid var(--line-dim);border-radius:5px;padding:2px 0 1px}
.st5 b{display:block;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.st5 span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{display:flex;flex-direction:column;gap:10px}
.bannerp{display:flex;gap:10px;align-items:center;min-height:36px}
.step{flex:none;width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--torch);color:var(--torch);border-radius:50%;font-weight:700;font-size:16px}
.bannerp p{margin:0;font-size:18px}
.bannerp p em{font-style:normal;color:var(--torch);font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cbox{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:74px;padding:6px 4px;background:rgba(143,207,122,.06);border:1.5px solid var(--line-dim);border-radius:9px;text-align:center;color:var(--chalk)}
.cbox .lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cbox .val{font-size:32px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.cbox .sub{font-size:12.5px;color:var(--muted);min-height:18px;font-weight:500}
.cbox.slot{border-style:dashed;border-color:var(--line)}
.cbox.slot.filled{border-style:solid;border-color:var(--torch);background:rgba(255,177,59,.08)}
.cbox.slot.tgt{border-color:var(--sel);background:rgba(108,196,255,.08)}
.cbox .bar{position:absolute;left:8px;right:8px;bottom:4px;height:3px;background:var(--line-dim);border-radius:2px;overflow:hidden}
.cbox .bar i{display:block;height:100%;background:var(--torch)}
.dice-row{display:flex;gap:14px;justify-content:center;min-height:62px;align-items:center}
.die{position:relative;width:58px;height:58px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--chalk);color:#10240f;border:0;border-radius:11px;box-shadow:0 3px 0 #9dbb8c;transition:transform .15s}
.die b{font-family:var(--display);font-weight:400;font-size:34px;line-height:.95}
.die small{position:absolute;right:5px;top:3px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#4b6b42}
.die.sel{transform:translateY(-4px);box-shadow:0 0 0 3px var(--torch),0 6px 0 #9dbb8c}
.die.used{opacity:.25;pointer-events:none}
.die.rr{box-shadow:0 0 0 3px var(--torch),0 3px 0 #9dbb8c}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.log{margin:0;min-height:40px;color:var(--muted);font-size:18px}
.log b{color:var(--torch);font-weight:700}
.hint{color:var(--torch);font-weight:600}
.pickhint{text-align:center;color:var(--muted);font-size:15px;margin:0}
/* modales */
.veil{position:fixed;inset:0;background:rgba(2,8,4,.78);display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:10}
.modal{background:var(--card);border:1.5px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-width:440px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px;
  box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--line-dim)}
.up{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up.three{grid-template-columns:1fr 1fr 1fr}
ul.rules{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const E = (function(){
'use strict';
/* Garden Crawler — motor (sin DOM). Reglas basadas en D6 Crawler, tablero 6x6 y kits de dados por héroe. */
const COLS = 6, ROWS = 6, N = COLS * ROWS;
const idx = (x, y) => y * COLS + x;
const XY = i => [i % COLS, (i / COLS) | 0];
// [dx, dy, coste de Movimiento]: recto 2, diagonal 3
const DIRS = [[1,0,2],[-1,0,2],[0,1,2],[0,-1,2],[1,1,3],[1,-1,3],[-1,1,3],[-1,-1,3]];
const START_HP = 6, SKILL_MAX = 6;

let rnd = Math.random;
function setRng(f) { rnd = f || Math.random; }
const roll = s => 1 + Math.floor(rnd() * s);

/* ---------- Datos ---------- */
const HEROES = {
  beetle: { key: 'beetle', name: 'Escarabajo rinoceronte', emoji: '🪲', kit: [8, 6, 4],
    abil: 'Cornada', txt: 'Una vez por nivel, empuja a un monstruo pegado a ti (en recto) hasta 3 casillas. Si choca con un muro, el borde u otro monstruo, recibe 1 de daño (y el otro monstruo también).' },
  mantis: { key: 'mantis', name: 'Mantis religiosa', emoji: '🦗', kit: [12, 4, 4],
    abil: 'Emboscada', txt: 'Pasiva: si todavía no te has movido en el turno, tu primer ataque hace 2 de daño.' }
};
/* Prueba 2 «Muda»: kits iniciales más pequeños; en cada pausa un dado puede mudar al siguiente tamaño. */
const MUDA_KITS = { beetle: [6, 6, 4], mantis: [8, 4, 4] };
const DIE_STEPS = [4, 6, 8, 12];
const nextDie = s => DIE_STEPS[DIE_STEPS.indexOf(s) + 1] || 0;
const EQUIPS = {
  thorn: { key: 'thorn', name: 'Espina de rosa', emoji: '🌹', type: 'Arma', txt: 'Tus ataques cuestan 1 punto de Ataque menos (mínimo 1).' },
  shield: { key: 'shield', name: 'Escudo de pétalo', emoji: '🌸', type: 'Armadura', txt: 'Tu Defensa es 1 punto más alta en cada turno.' },
  helm: { key: 'helm', name: 'Casco de bellota', emoji: '🌰', type: 'Armadura', txt: 'Una vez por turno, repites un dado y te quedas con el mejor de los dos resultados.' }
};
const MONS = {
  tij: { key: 'tij', name: 'Tijereta', plural: 'Tijeretas', emoji: '🦂', color: '#b5473a', hp: 2, spd: 6, atk: 4, def: 3, rng: 3, txt: 'Rápida y frágil.' },
  bom: { key: 'bom', name: 'Escarabajo bombardero', plural: 'Escarabajos bombarderos', emoji: '🐞', color: '#c0792b', hp: 3, spd: 4, atk: 5, def: 5, rng: 5, txt: 'Dispara a distancia.' },
  coc: { key: 'coc', name: 'Cochinilla', plural: 'Cochinillas', emoji: '🐌', color: '#6c7a89', hp: 4, spd: 3, atk: 6, def: 6, rng: 3, txt: 'Lenta y acorazada.' },
  avi: { key: 'avi', name: 'Avispón', plural: 'Avispones', emoji: '🐝', color: '#c9a227', hp: 4, spd: 5, atk: 8, def: 5, rng: 4, txt: 'Golpea muy fuerte.' }
};
const MAPS = {
  A: ['......', '.#..#.', '......', '..##..', '.#....', 'H...#.'],
  B: ['..#...', '...#..', '.##...', '...#.#', '.#....', '....#H']
};
const rot180 = m => m.slice().reverse().map(r => r.split('').reverse().join(''));
MAPS.A2 = rot180(MAPS.A); MAPS.B2 = rot180(MAPS.B);

// 12 niveles: cada combinación mapa+giro enfrenta siempre al mismo monstruo; cambian la cantidad y las posiciones
const LEVEL_DEFS = [
  { t: 'Los tulipanes',   map: 'A',  m: 'tij', at: [[3,2],[2,0],[4,2],[2,2]] },
  { t: 'El seto de boj',  map: 'B',  m: 'coc', at: [[5,0]] },
  { t: 'Macetas volcadas', map: 'A2', m: 'bom', at: [[0,1],[0,4],[0,3]] },
  { t: 'El compost',      map: 'B2', m: 'avi', at: [[5,2],[5,4]] },
  { t: 'El rosal',        map: 'A',  m: 'tij', at: [[0,1],[1,0],[3,1],[1,3],[2,2],[5,0],[4,2]] },
  { t: 'La enredadera',   map: 'B',  m: 'coc', at: [[2,5],[4,0],[1,0]] },
  { t: 'El invernadero',  map: 'A2', m: 'bom', at: [[3,3],[0,3],[4,5],[5,4],[0,5]] },
  { t: 'El cobertizo',    map: 'B2', m: 'avi', at: [[5,1],[4,4],[5,2],[5,5],[1,5],[5,4]] },
  { t: 'La glorieta',     map: 'A',  m: 'tij', at: [[5,0],[4,4],[5,5],[3,1],[2,2],[2,4],[1,3],[4,0],[4,3]] },
  { t: 'El estanque seco', map: 'B', m: 'coc', at: [[3,0],[2,1],[4,1],[0,4]] },
  { t: 'El muro de piedra', map: 'A2', m: 'bom', at: [[3,1],[5,4],[1,1],[3,3],[2,1],[0,4],[4,3]] },
  { t: 'El panal',        map: 'B2', m: 'avi', at: [[0,5],[5,3],[5,2],[5,4],[1,5],[1,4],[3,1],[5,1]] }
];

/* ---------- Acciones ---------- */
function afterAction() {
  if (S.phase === 'move' && E.levelCleared(S)) {
    if (S.levelIdx >= E.LEVELS.length - 1) { ui.modal = { t: 'won' }; S.phase = 'won'; }
    else ui.modal = { t: 'break' };
  }
  render();
}
function fx(i, txt) { ui.fx[i] = txt; setTimeout(() => { delete ui.fx[i]; if (!ui.anim) render(); }, 900); }
async function endTurn() {
  if (ui.anim || S.phase !== 'move') return;
  ui.anim = true; ui.cornada = false;
  ui.disp = S.mons.map(m => Object.assign({}, m));
  const ev = E.endTurn(S);
  say('Los bichos se mueven…'); render();
  for (const e of ev) {
    if (e.t === 'move') {
      const d = ui.disp.find(o => o.id === e.id);
      for (const c of e.path.slice(1)) { const [x, y] = XY(c); d.x = x; d.y = y; render(); await sleep(150); }
    } else if (e.t === 'attack') {
      const hi = idx(S.adv.x, S.adv.y);
      if (!e.ids.length) say('Ningún bicho te alcanza.');
      else if (e.dmg > 0) { say(`Te atacan ${e.ids.length}: Ataque total ${e.total} ÷ tu Defensa ${e.def} = <b>${e.dmg} de daño</b>.`); fx(hi, '−' + e.dmg); }
      else say(`Te atacan ${e.ids.length}: Ataque total ${e.total} ÷ tu Defensa ${e.def} = 0 de daño.`);
      render(); await sleep(500);
    }
  }
  ui.disp = null; ui.anim = false;
  if (S.phase === 'dead') { ui.modal = { t: 'dead' }; }
  else { ui.selDie = -1; ui.rr = false; say('Nuevo turno: reparte tus dados.'); }
  render();
}
function onClick(ev) {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (ui.anim) return;
  if (act === 'new') { ui.screen = 'adv'; render(); return; }
  if (act === 'adv') { ui.mode = k; ui.hero = null; ui.equip = null; ui.screen = 'hero'; render(); return; }
  if (act === 'hero') { ui.hero = k; ui.screen = 'equip'; render(); return; }
  if (act === 'equip') { ui.equip = k; render(); return; }
  if (act === 'back') { ui.screen = ui.screen === 'equip' ? 'hero' : ui.screen === 'hero' ? 'adv' : 'menu'; render(); return; }
  if (act === 'begin') {
    if (!ui.hero || !ui.equip) return;
    E.loadLevels(E.DEFS[ui.mode]); S = E.newRun(ui.hero, ui.equip, ui.mode);
    ui.screen = 'game'; ui.selDie = -1; ui.rr = false; ui.modal = null; ui.cornada = false; say('Nivel 1. Tira de tus dados y repártelos.'); render(); return;
  }
  if (act === 'rules') { ui.modal = { t: 'rules' }; render(); return; }
  if (act === 'menu') { ui.modal = { t: 'menu' }; render(); return; }
  if (act === 'close') { ui.modal = null; render(); return; }
  if (act === 'restart') { ui.screen = 'menu'; ui.modal = null; S = null; render(); return; }
  if (!S) return;
  if (act === 'retry') { E.retryLevel(S); ui.modal = null; ui.selDie = -1; ui.rr = false; ui.cornada = false; say('Nivel reiniciado. Reparte tus dados.'); render(); return; }
  if (act === 'up') {
    if (!E.applyBreak(S, k)) return;
    const done = !E.nextLevel(S);
    ui.modal = done ? { t: 'won' } : null; ui.selDie = -1; ui.rr = false; ui.cornada = false;
    say(`Nivel ${S.levelIdx + 1}: ${E.lvOf(S).title}. Reparte tus dados.`); render(); return;
  }
  if (ui.modal) return;
  if (S.phase === 'energy') {
    const t = S.turn;
    if (act === 'die') {
      const i = +el.dataset.i;
      if (ui.rr) { const old = t.dice[i]; E.useHelm(S, i); ui.rr = false; const nw = t.lastRoll; say(`Repetiste el D${t.sides[i]}: tenías ${old}, salió ${nw}. ` + (nw > old ? `Te quedas con <b>${nw}</b>.` : `Te quedas con <b>${old}</b> (el mejor de los dos).`)); render(); return; }
      ui.selDie = ui.selDie === i ? -1 : i; render(); return;
    }
    if (act === 'slot') {
      if (ui.selDie >= 0) { E.assignDie(S, k, ui.selDie); ui.selDie = -1; }
      else if (t.assign[k] >= 0) E.unassign(S, k);
      render(); return;
    }
    if (act === 'helm') { if (E.canReroll(S)) { ui.rr = !ui.rr; ui.selDie = -1; render(); } return; }
    if (act === 'confirm') {
      if (!E.assignComplete(t)) return;
      E.confirmEnergy(S); ui.selDie = -1; ui.rr = false;
      say(S.hero === 'mantis' ? 'Tu fase. Si atacas antes de moverte, tu primer golpe hace 2 de daño.' : 'Tu fase: muévete (casillas verdes) y ataca (bichos con borde rojo).');
      render(); return;
    }
    return;
  }
  if (S.phase !== 'move') return;
  if (act === 'go') {
    const i = +el.dataset.i, R = E.reachFromAdv(S);
    if (!(R.dist[i] > 0 && R.dist[i] <= S.turn.spdLeft)) return;
    E.moveAdv(S, i, R.dist[i]); ui.cornada = false; say(`Te mueves (−${R.dist[i]} de Movimiento).`); afterAction(); return;
  }
  if (act === 'mon') {
    const m = S.mons.find(o => o.id === +el.dataset.id); if (!m) return;
    if (ui.cornada) {
      const r = E.cornada(S, m);
      ui.cornada = false;
      if (!r) { say('La Cornada solo empuja a un bicho pegado a ti, en recto (no en diagonal).'); render(); return; }
      const [tx, ty] = r.to;
      say(r.hit ? `¡Cornada! Choca ${r.hit === 'wall' ? 'con un muro o el borde' : 'con otro bicho'}: recibe 1 de daño${r.other ? ' (y el otro también)' : ''}.` : `¡Cornada! Lo empujas ${r.steps} casillas.`);
      if (r.hit) fx(idx(tx, ty), '−1');
      afterAction(); return;
    }
    const inf = E.attackInfo(S, m);
    if (!inf.ok) {
      say(inf.why === 'range' ? `Fuera de alcance: está a distancia ${inf.rd} y tu Alcance es ${S.turn.rng}.` : inf.why === 'los' ? 'No tienes línea de tiro: un muro u otro bicho estorba.' : `Te faltan puntos de Ataque: cuesta ${inf.cost} y te quedan ${S.turn.atkLeft}.`);
      render(); return;
    }
    const r = E.attackMon(S, m);
    say(`Golpeas a ${E.lvOf(S).mon.name} ${m.id} (−${inf.cost} de Ataque, ${r.dmg} de daño)${r.dead ? ' y lo derrotas.' : '.'}`);
    fx(idx(m.x, m.y), '−' + r.dmg); afterAction(); return;
  }
  if (act === 'cornada') {
    if (S.abil) return;
    ui.cornada = !ui.cornada;
    say(ui.cornada ? 'Toca un bicho pegado a ti (arriba, abajo o a los lados) para empujarlo.' : 'Cornada cancelada.'); render(); return;
  }
  if (act === 'undo') { if (S.undo.length) { E.popUndo(S); ui.cornada = false; say('Acción deshecha.'); render(); } return; }
  if (act === 'end') { endTurn(); return; }
}
app.addEventListener('click', onClick);
window.__gc = { E, get S() { return S; }, ui, render };
render();
})();
</script>
